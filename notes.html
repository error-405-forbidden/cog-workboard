<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>サイトメモ｜朝夕ボード</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f5f4;--surface:#fff;--soft:#f7f9f8;--ink:#22322e;--muted:#62726d;--line:#dbe3df;--accent:#176859;--accent-hover:#105446;--accent-soft:#e5f2ed;--shadow:0 8px 32px #193b2b0a;--radius:12px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#17201d;--surface:#202c27;--soft:#26322d;--ink:#eaf2ed;--muted:#acbeb3;--line:#3d4e44;--accent:#8cd0b4;--accent-hover:#b2e3ce;--accent-soft:#29493b;--shadow:0 8px 32px #0002;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.65}
h1{font-size:22px;letter-spacing:.035em;margin:0}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0}
button,select{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.shell{max-width:1040px;margin:auto;padding:0 24px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:80px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.brandmark{display:grid;place-items:center;width:38px;height:38px;background:var(--accent);color:var(--surface);border-radius:12px;font-weight:900}
.brand-caption{font-size:12px;color:var(--muted);letter-spacing:.13em}
.view-badge{font-size:13px;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:6px;white-space:nowrap}
.status{margin:22px 0;padding:12px 14px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:14px}
.status.error{background:#fff0ee;color:#a63333}
.notes-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start;margin-top:22px}
.notes-projects{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.notes-projects h3{font-size:13px;color:var(--muted);padding:6px 10px 10px}
.project-list{display:flex;flex-direction:column;gap:5px}
.project-button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;padding:12px 10px;border-radius:7px;font-size:14px;min-height:44px}
.project-button[aria-pressed=true]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.project-button:hover{background:var(--soft)}
.project-name{overflow-wrap:anywhere}
.project-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.notes-mobile-picker{display:none}
.notes-main{min-width:0}
.notes-project-heading{font-size:20px;margin-bottom:16px;overflow-wrap:anywhere}
.note-history{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--line);margin-left:8px;padding-left:22px}
.project-note{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.project-note::before{content:'';position:absolute;left:-29px;top:25px;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);background:var(--bg)}
.project-note-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:9px}
.project-note-head time{font-weight:700;color:var(--ink);font-size:14px}
.project-note-text{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}
.note-empty{border:1px dashed var(--line);border-radius:10px;padding:30px 20px;text-align:center;color:var(--muted);font-size:14px}
.note-empty strong{display:block;color:var(--ink);margin-bottom:6px}
@media(max-width:800px){.notes-layout{grid-template-columns:minmax(0,1fr);gap:16px}.notes-projects{display:none}.notes-mobile-picker{display:flex;flex-direction:column;gap:6px}.notes-mobile-picker select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}.note-history{padding-left:17px;margin-left:5px}.project-note{padding:16px}.project-note::before{left:-24px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
 <div class="brand"><div class="brandmark">🗒</div><div><div class="brand-caption">COG / DAILY WORK</div><h1>朝夕ボード</h1></div></div>
 <div class="view-badge">サイトメモ（閲覧専用）</div>
</header>
<div class="status" id="status">読み込み中…</div>
<div class="notes-layout" id="layout" hidden>
 <div class="notes-projects" aria-hidden="true">
  <h3>案件</h3>
  <div class="project-list" id="projectList"></div>
 </div>
 <div class="notes-main">
  <div class="notes-mobile-picker">
   <select id="projectSelect" aria-label="案件を選択"></select>
  </div>
  <h2 class="notes-project-heading" id="projectHeading"></h2>
  <div id="history"></div>
 </div>
</div>
</div>
<script>
var firebaseConfig={apiKey:"AIzaSyCWisNJZn0hktFP3pXof-DYau0LnnjQScQ",authDomain:"cog-workboard.firebaseapp.com",databaseURL:"https://cog-workboard-default-rtdb.firebaseio.com",projectId:"cog-workboard",storageBucket:"cog-workboard.firebasestorage.app",messagingSenderId:"779252971360",appId:"1:779252971360:web:7cf0a3a3bdca7b565e5005"};
firebase.initializeApp(firebaseConfig);
var rtdb=firebase.database();
var TAGS=['ジムセレ','買取サファリ','金融メディアサイト群','自社サイト','共通/インフラ','その他'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function canonicalProject(tag){return tag==='共通・インフラ'?'共通/インフラ':String(tag||'その他');}
function labelTag(tag){return tag==='共通/インフラ'?'共通・インフラ':tag;}
function isoDay(v){if(typeof v!=='string')return null;var m=v.match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:null;}
function noteCreatedDay(ts){var d=new Date(ts);return isNaN(d.getTime())?'':d.toISOString().slice(0,10);}
var notes=[],currentProject='ジムセレ',hasData=false;
function getProjects(){var set={};TAGS.forEach(function(t){set[t]=true;});notes.forEach(function(n){set[n.projectTag]=true;});set[currentProject]=true;return Object.keys(set);}
function projectNotes(project){var list=notes.filter(function(n){return n.projectTag===canonicalProject(project);});list.sort(function(a,b){return (String(b.date).localeCompare(String(a.date)))||b.createdAt.localeCompare(a.createdAt);});return list;}
function renderProjects(){
 var projects=getProjects();
 var listEl=document.getElementById('projectList');listEl.innerHTML='';
 var selectEl=document.getElementById('projectSelect');selectEl.innerHTML='';
 projects.forEach(function(tag){
  var count=notes.filter(function(n){return n.projectTag===tag;}).length;
  var b=document.createElement('button');b.type='button';b.className='project-button';b.setAttribute('aria-pressed',String(tag===currentProject));
  b.innerHTML='<span class="project-name">'+esc(labelTag(tag))+'</span><span class="project-count">'+(hasData?count+'件':'—')+'</span>';
  b.addEventListener('click',function(){currentProject=tag;render();});
  listEl.appendChild(b);
  var opt=document.createElement('option');opt.value=tag;opt.textContent=labelTag(tag)+(hasData?'（'+count+'件）':'');selectEl.appendChild(opt);
 });
 selectEl.value=currentProject;
}
document.getElementById('projectSelect').addEventListener('change',function(e){currentProject=e.target.value;render();});
function renderHistory(){
 var list=projectNotes(currentProject);
 var el=document.getElementById('history');
 if(!hasData){el.innerHTML='<div class="note-empty">読み込み中です…</div>';return;}
 if(!list.length){el.innerHTML='<div class="note-empty"><strong>まだ記録はありません</strong></div>';return;}
 el.innerHTML='<div class="note-history">'+list.map(function(n){
  var created=noteCreatedDay(n.createdAt),recorded='';
  if(created&&created!==n.date)recorded='<p style="font-size:12px;color:var(--muted);margin-top:12px">追記日：'+esc(created)+'</p>';
  return '<article class="project-note"><div class="project-note-head"><time datetime="'+esc(n.date)+'">'+esc(n.date||'日付未設定')+'</time><span>'+esc(n.author)+'</span></div><p class="project-note-text">'+esc(n.text)+'</p>'+recorded+'</article>';
 }).join('')+'</div>';
}
function render(){document.getElementById('projectHeading').textContent=labelTag(currentProject);renderProjects();renderHistory();}
render();
rtdb.ref('siteMemos').on('value',function(snap){
 var val=snap.val()||{};
 notes=Object.keys(val).map(function(id){
  var raw=val[id]||{};
  return {id:id,projectTag:canonicalProject(raw.projectTag),text:typeof raw.text==='string'?raw.text:'',date:isoDay(raw.date)||noteCreatedDay(raw.createdAt),author:String(raw.author||'未設定'),createdAt:typeof raw.createdAt==='string'?raw.createdAt:''};
 });
 hasData=true;
 document.getElementById('status').hidden=true;
 document.getElementById('layout').hidden=false;
 render();
},function(err){
 var s=document.getElementById('status');s.hidden=false;s.className='status error';s.textContent='読み込めませんでした。時間をおいて再度開いてください。('+(err&&err.message||'')+')';
});
</script>
</body>
</html>
