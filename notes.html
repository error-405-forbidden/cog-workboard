<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>サイトメモ｜朝夕ボード</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link rel="stylesheet" href="assets/notes.css">
<link rel="stylesheet" href="assets/records.css">
<link rel="stylesheet" href="assets/dashboard.css">
<link rel="stylesheet" href="assets/compact.css">
</head>
<body>
<div class="shell">
<header class="topbar">
 <div class="brand"><div class="brandmark">🗒</div><div><div class="brand-caption">COG / DAILY WORK</div><h1>朝夕ボード</h1></div></div>
 <div class="view-badge">このリンクを知っている人は誰でも閲覧・編集・コメントできます</div>
</header>
<nav class="view-nav">
 <button type="button" id="navNotes" aria-pressed="true">サイトメモ</button>
 <button type="button" id="navStaff" aria-pressed="false">外注さん</button>
</nav>
<div class="status" id="status">読み込み中…</div>

<div class="notes-layout" id="notesView" hidden>
 <div class="notes-projects">
  <div class="notes-projects-head"><h3>案件</h3></div>
  <div class="project-list" id="projectList"></div>
 </div>
 <div class="notes-main">
  <div class="notes-mobile-picker">
   <select id="projectSelect" aria-label="案件を選択"></select>
  </div>
  <h2 class="notes-project-heading" id="projectHeading"></h2>
  <div id="history"></div>
 </div>
</div>

<div id="staffView" hidden>
 <div class="notes-mobile-picker">
  <select id="staffSelect" aria-label="外注さんを選択"></select>
  <button type="button" id="staffAddMobile" class="mobile-staff-add" aria-label="外注さんを追加">＋</button>
 </div>
 <div class="staff-columns">
  <div class="staff-profile-pane"><div id="staffDetail"></div></div>
  <div class="staff-log-pane"><h3 class="staff-log-heading">ログ</h3><div id="staffLog"></div></div>
  <aside class="notes-projects staff-list-pane">
   <div class="notes-projects-head"><h3>外注さん</h3><button type="button" id="staffAdd" title="新しく追加">＋</button></div>
   <div class="project-list" id="staffList"></div>
  </aside>
 </div>
</div>

</div>
<script src="assets/firebase-config.js"></script>
<script src="assets/workboard-core.js"></script>
<script src="assets/records-ui.js"></script>
<script src="assets/notes-app.js"></script>
</body>
</html>
