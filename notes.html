<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>サイトメモ｜朝夕ボード</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root{--bg:#f3f5f4;--surface:#fff;--soft:#f7f9f8;--ink:#22322e;--muted:#62726d;--line:#dbe3df;--accent:#176859;--accent-hover:#105446;--accent-soft:#e5f2ed;--shadow:0 8px 32px #193b2b0a;--radius:12px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#17201d;--surface:#202c27;--soft:#26322d;--ink:#eaf2ed;--muted:#acbeb3;--line:#3d4e44;--accent:#8cd0b4;--accent-hover:#b2e3ce;--accent-soft:#29493b;--shadow:0 8px 32px #0002;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.65}
h1{font-size:22px;letter-spacing:.035em;margin:0}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0}
button,select{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.shell{max-width:1040px;margin:auto;padding:0 24px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:80px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px}
.brandmark{display:grid;place-items:center;width:38px;height:38px;background:var(--accent);color:var(--surface);border-radius:12px;font-weight:900}
.brand-caption{font-size:12px;color:var(--muted);letter-spacing:.13em}
.view-badge{font-size:13px;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:6px;white-space:nowrap}
.view-nav{display:flex;gap:8px;margin-top:22px;border-bottom:1px solid var(--line)}
.view-nav button{background:transparent;border:0;min-height:44px;padding:9px 16px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;font-size:15px}
.view-nav button[aria-pressed=true]{color:var(--accent);border-bottom-color:var(--accent)}
.view-nav button:hover{background:var(--accent-soft)}
.status{margin:22px 0;padding:12px 14px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:14px}
.status.error{background:#fff0ee;color:#a63333}
.notes-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:start;margin-top:22px}
.notes-projects{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.notes-projects-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px 10px}
.notes-projects-head h3{font-size:13px;color:var(--muted)}
.notes-projects-head button{background:transparent;border:0;color:var(--accent);font-size:18px;line-height:1;padding:0 4px;font-weight:900}
.project-list{display:flex;flex-direction:column;gap:5px}
.project-button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;padding:12px 10px;border-radius:7px;font-size:14px;min-height:44px}
.project-button[aria-pressed=true]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.project-button:hover{background:var(--soft)}
.project-name{overflow-wrap:anywhere}
.project-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.notes-mobile-picker{display:none}
.notes-main{min-width:0}
.notes-project-heading{font-size:20px;margin-bottom:16px;overflow-wrap:anywhere}
.note-history{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--line);margin-left:8px;padding-left:22px}
.project-note{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.project-note::before{content:'';position:absolute;left:-29px;top:25px;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);background:var(--bg)}
.project-note-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:9px}
.project-note-head time{font-weight:700;color:var(--ink);font-size:14px}
.project-note-text{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}
.note-empty{border:1px dashed var(--line);border-radius:10px;padding:30px 20px;text-align:center;color:var(--muted);font-size:14px}
.note-empty strong{display:block;color:var(--ink);margin-bottom:6px}
.note-actions{display:flex;gap:10px;margin-top:12px}
.note-actions button{background:transparent;border:0;color:var(--accent);font-size:13px;font-weight:700;padding:4px 0;cursor:pointer}
.note-actions button:hover{text-decoration:underline}
.edit-form{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.edit-form textarea{width:100%;min-height:100px;font:inherit;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.edit-form-row{display:flex;gap:10px;flex-wrap:wrap}
.edit-form-row input{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.edit-form-row input[type=date]{width:150px}
.edit-form-row input[type=text]{flex:1;min-width:120px}
.edit-form-foot{display:flex;gap:8px;justify-content:flex-end}
.edit-form-foot button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.edit-form-foot button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.form-msg{font-size:12px;color:#a63333}
.comments{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.comment{background:var(--soft);border-radius:8px;padding:10px 12px}
.comment-head{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:4px}
.comment-head strong{color:var(--ink);font-size:13px}
.comment-text{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.comment-form{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.comment-form input,.comment-form textarea{width:100%;font:inherit;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.comment-form textarea{min-height:70px;resize:vertical}
.comment-form-foot{display:flex;justify-content:flex-end;gap:8px}
.staff-profile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.staff-name{font-size:20px;font-weight:700;margin-bottom:14px;overflow-wrap:anywhere}
.staff-next{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:18px}
.staff-next label{font-size:13px;font-weight:700;color:var(--accent)}
.staff-next input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.staff-next .saved-flag{font-size:12px;color:var(--accent)}
.staff-section+.staff-section{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.staff-section-label{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}
.staff-updated{font-size:12px;color:var(--muted);margin-top:16px}
.staff-log-heading{font-size:14px;color:var(--muted);margin:24px 0 12px}
@media(max-width:800px){.notes-layout{grid-template-columns:minmax(0,1fr);gap:16px}.notes-projects{display:none}.notes-mobile-picker{display:flex;flex-direction:column;gap:6px}.notes-mobile-picker select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}.note-history{padding-left:17px;margin-left:5px}.project-note{padding:16px}.project-note::before{left:-24px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
 <div class="brand"><div class="brandmark">🗒</div><div><div class="brand-caption">COG / DAILY WORK</div><h1>朝夕ボード</h1></div></div>
 <div class="view-badge">このリンクを知っている人は誰でも閲覧・編集・コメントできます</div>
</header>
<nav class="view-nav">
 <button type="button" id="navNotes" aria-pressed="true">サイトメモ</button>
 <button type="button" id="navStaff" aria-pressed="false">外注さん</button>
</nav>
<div class="status" id="status">読み込み中…</div>

<div class="notes-layout" id="notesView" hidden>
 <div class="notes-projects" aria-hidden="true">
  <div class="notes-projects-head"><h3>案件</h3></div>
  <div class="project-list" id="projectList"></div>
 </div>
 <div class="notes-main">
  <div class="notes-mobile-picker">
   <select id="projectSelect" aria-label="案件を選択"></select>
  </div>
  <h2 class="notes-project-heading" id="projectHeading"></h2>
  <div id="history"></div>
 </div>
</div>

<div class="notes-layout" id="staffView" hidden>
 <div class="notes-projects" aria-hidden="true">
  <div class="notes-projects-head"><h3>外注さん</h3><button type="button" id="staffAdd" title="新しく追加">＋</button></div>
  <div class="project-list" id="staffList"></div>
 </div>
 <div class="notes-main">
  <div class="notes-mobile-picker">
   <select id="staffSelect" aria-label="外注さんを選択"></select>
  </div>
  <div id="staffDetail"></div>
 </div>
</div>

</div>
<script>
var firebaseConfig={apiKey:"AIzaSyCWisNJZn0hktFP3pXof-DYau0LnnjQScQ",authDomain:"cog-workboard.firebaseapp.com",databaseURL:"https://cog-workboard-default-rtdb.firebaseio.com",projectId:"cog-workboard",storageBucket:"cog-workboard.firebasestorage.app",messagingSenderId:"779252971360",appId:"1:779252971360:web:7cf0a3a3bdca7b565e5005"};
firebase.initializeApp(firebaseConfig);
var rtdb=firebase.database();
var authReady=false;
var TAGS=['ジムセレ','買取サファリ','金融メディアサイト群','自社サイト','共通/インフラ','その他'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function canonicalProject(tag){return tag==='共通・インフラ'?'共通/インフラ':String(tag||'その他');}
function labelTag(tag){return tag==='共通/インフラ'?'共通・インフラ':tag;}
function isoDay(v){if(typeof v!=='string')return null;var m=v.match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:null;}
function noteCreatedDay(ts){var d=new Date(ts);return isNaN(d.getTime())?'':d.toISOString().slice(0,10);}

/* ---------- view switching ---------- */
var currentView='notes';
function showView(view){
 currentView=view;
 document.getElementById('navNotes').setAttribute('aria-pressed',String(view==='notes'));
 document.getElementById('navStaff').setAttribute('aria-pressed',String(view==='staff'));
 document.getElementById('notesView').hidden=(view!=='notes')||!hasData;
 document.getElementById('staffView').hidden=(view!=='staff')||!staffHasData;
 if(view==='staff')renderStaff();else render();
}
document.getElementById('navNotes').addEventListener('click',function(){showView('notes');});
document.getElementById('navStaff').addEventListener('click',function(){showView('staff');});

/* ---------- サイトメモ（案件） ---------- */
var notes=[],comments=[],currentProject='ジムセレ',hasData=false,commentsHasData=false;
var editingId=null,editDraft={};
var openCommentId=null,commentDrafts={};
function getProjects(){var set={};TAGS.forEach(function(t){set[t]=true;});notes.forEach(function(n){set[n.projectTag]=true;});set[currentProject]=true;return Object.keys(set);}
function projectNotes(project){var list=notes.filter(function(n){return n.projectTag===canonicalProject(project);});list.sort(function(a,b){return (String(b.date).localeCompare(String(a.date)))||b.createdAt.localeCompare(a.createdAt);});return list;}
function commentsFor(memoId){var list=comments.filter(function(c){return c.memoId===memoId;});list.sort(function(a,b){return a.createdAt.localeCompare(b.createdAt);});return list;}
function startEdit(n){editingId=n.id;editDraft={text:n.text,date:n.date,author:n.author,msg:''};renderHistory();}
function cancelEdit(){editingId=null;editDraft={};renderHistory();}
function saveEdit(id){
 var d=editDraft;
 if(!d.text||!d.text.trim()){editDraft.msg='本文を入力してください。';renderHistory();return;}
 rtdb.ref('siteMemos/'+id).update({text:d.text.trim(),date:d.date||'',author:(d.author||'').trim()||'未設定'}).then(function(){
  editingId=null;editDraft={};renderHistory();
 }).catch(function(err){
  editDraft.msg='保存できませんでした。('+(err&&err.message||'')+')';renderHistory();
 });
}
function openComment(memoId){openCommentId=memoId;if(!commentDrafts[memoId])commentDrafts[memoId]={text:'',author:'',msg:''};renderHistory();}
function closeComment(){openCommentId=null;renderHistory();}
function submitComment(memoId){
 var d=commentDrafts[memoId]||{};
 if(!d.text||!d.text.trim()){d.msg='コメントを入力してください。';renderHistory();return;}
 rtdb.ref('siteMemoComments').push({memoId:memoId,text:d.text.trim(),author:(d.author||'').trim()||'匿名',createdAt:new Date().toISOString()}).then(function(){
  delete commentDrafts[memoId];openCommentId=null;renderHistory();
 }).catch(function(err){
  d.msg='送信できませんでした。('+(err&&err.message||'')+')';renderHistory();
 });
}
function renderProjects(){
 var projects=getProjects();
 var listEl=document.getElementById('projectList');listEl.innerHTML='';
 var selectEl=document.getElementById('projectSelect');selectEl.innerHTML='';
 projects.forEach(function(tag){
  var count=notes.filter(function(n){return n.projectTag===tag;}).length;
  var b=document.createElement('button');b.type='button';b.className='project-button';b.setAttribute('aria-pressed',String(tag===currentProject));
  b.innerHTML='<span class="project-name">'+esc(labelTag(tag))+'</span><span class="project-count">'+(hasData?count+'件':'—')+'</span>';
  b.addEventListener('click',function(){currentProject=tag;render();});
  listEl.appendChild(b);
  var opt=document.createElement('option');opt.value=tag;opt.textContent=labelTag(tag)+(hasData?'（'+count+'件）':'');selectEl.appendChild(opt);
 });
 selectEl.value=currentProject;
}
document.getElementById('projectSelect').addEventListener('change',function(e){currentProject=e.target.value;render();});
function renderCommentThread(memoId,refPath){
 var list=refPath==='staffNotes'?staffNotesFor(memoId):commentsFor(memoId);
 var html='<div class="comments">';
 html+=list.map(function(c){
  var day=noteCreatedDay(c.createdAt);
  if(refPath==='staffNotes'&&staffLogEditingId===c.id){
   var ed=staffLogEditDraft;
   return '<div class="comment"><div class="edit-form">'
    +'<input type="text" data-role="log-e-author" placeholder="お名前" value="'+esc(ed.author||'')+'">'
    +'<textarea data-role="log-e-text">'+esc(ed.text||'')+'</textarea>'
    +(ed.msg?'<div class="form-msg">'+esc(ed.msg)+'</div>':'')
    +'<div class="edit-form-foot"><button type="button" data-action="log-e-cancel">キャンセル</button><button type="button" class="primary" data-action="log-e-save" data-id="'+esc(c.id)+'">保存</button></div>'
    +'</div></div>';
  }
  var actions=refPath==='staffNotes'?('<div class="note-actions"><button type="button" data-action="log-edit-open" data-id="'+esc(c.id)+'">編集</button><button type="button" data-action="log-delete" data-id="'+esc(c.id)+'">'+(staffLogDeleteArmedId===c.id?'本当に削除？もう一度クリック':'削除')+'</button></div>'):'';
  return '<div class="comment"><div class="comment-head"><strong>'+esc(c.author)+'</strong><span>'+esc(day)+'</span></div><div class="comment-text">'+esc(c.text)+'</div>'+actions+'</div>';
 }).join('');
 var loaded=refPath==='staffNotes'?staffNotesHasData:commentsHasData;
 if(!loaded&&!list.length){html+='<div style="font-size:12px;color:var(--muted)">読み込み中…</div>';}
 var openId=refPath==='staffNotes'?openStaffNoteId:openCommentId;
 var drafts=refPath==='staffNotes'?staffNoteDrafts:commentDrafts;
 var action=refPath==='staffNotes'?'staffnote':'comment';
 if(openId===memoId){
  var d=drafts[memoId]||{text:'',author:''};
  html+='<div class="comment-form">'
   +'<input type="text" data-role="'+action+'-author" placeholder="お名前" value="'+esc(d.author)+'">'
   +'<textarea data-role="'+action+'-text" placeholder="'+(refPath==='staffNotes'?'ログを入力（いつ何を依頼した、連絡した、など）':'コメントを入力')+'">'+esc(d.text)+'</textarea>'
   +(d.msg?'<div class="form-msg">'+esc(d.msg)+'</div>':'')
   +'<div class="comment-form-foot"><button type="button" data-action="'+action+'-cancel">キャンセル</button><button type="button" class="primary" data-action="'+action+'-save" data-id="'+esc(memoId)+'" style="background:var(--accent);color:#fff;border:0;border-radius:7px;padding:7px 14px;font-size:13px;font-weight:700">送信</button></div>'
   +'</div>';
 }else{
  html+='<div class="note-actions"><button type="button" data-action="'+action+'-open" data-id="'+esc(memoId)+'">'+(refPath==='staffNotes'?'ログを追加':'コメントする')+'</button></div>';
 }
 html+='</div>';
 return html;
}
function renderHistory(){
 var list=projectNotes(currentProject);
 var el=document.getElementById('history');
 if(!hasData){el.innerHTML='<div class="note-empty">読み込み中です…</div>';return;}
 if(!list.length){el.innerHTML='<div class="note-empty"><strong>まだ記録はありません</strong></div>';return;}
 el.innerHTML='<div class="note-history">'+list.map(function(n){
  var created=noteCreatedDay(n.createdAt),recorded='';
  if(created&&created!==n.date)recorded='<p style="font-size:12px;color:var(--muted);margin-top:12px">追記日：'+esc(created)+'</p>';
  var body;
  if(editingId===n.id){
   var d=editDraft;
   body='<div class="edit-form">'
    +'<div class="edit-form-row"><input type="date" data-role="e-date" value="'+esc(d.date||'')+'"><input type="text" data-role="e-author" placeholder="記入者" value="'+esc(d.author||'')+'"></div>'
    +'<textarea data-role="e-text">'+esc(d.text||'')+'</textarea>'
    +(d.msg?'<div class="form-msg">'+esc(d.msg)+'</div>':'')
    +'<div class="edit-form-foot"><button type="button" data-action="edit-cancel">キャンセル</button><button type="button" class="primary" data-action="edit-save" data-id="'+esc(n.id)+'">保存</button></div>'
    +'</div>';
  }else{
   body='<p class="project-note-text">'+esc(n.text)+'</p>'+recorded
    +'<div class="note-actions"><button type="button" data-action="edit-open" data-id="'+esc(n.id)+'">編集</button></div>';
  }
  return '<article class="project-note"><div class="project-note-head"><time datetime="'+esc(n.date)+'">'+esc(n.date||'日付未設定')+'</time><span>'+esc(n.author)+'</span></div>'+body+renderCommentThread(n.id,'siteMemoComments')+'</article>';
 }).join('')+'</div>';
 bindHistoryEvents();
}
function bindHistoryEvents(){
 var el=document.getElementById('history');
 el.querySelectorAll('[data-action=edit-open]').forEach(function(b){b.addEventListener('click',function(){var n=notes.find(function(x){return x.id===b.dataset.id;});if(n)startEdit(n);});});
 el.querySelectorAll('[data-action=edit-cancel]').forEach(function(b){b.addEventListener('click',cancelEdit);});
 el.querySelectorAll('[data-action=edit-save]').forEach(function(b){b.addEventListener('click',function(){saveEdit(b.dataset.id);});});
 el.querySelectorAll('[data-role=e-text]').forEach(function(t){t.addEventListener('input',function(){editDraft.text=t.value;});});
 el.querySelectorAll('[data-role=e-date]').forEach(function(t){t.addEventListener('input',function(){editDraft.date=t.value;});});
 el.querySelectorAll('[data-role=e-author]').forEach(function(t){t.addEventListener('input',function(){editDraft.author=t.value;});});
 el.querySelectorAll('[data-action=comment-open]').forEach(function(b){b.addEventListener('click',function(){openComment(b.dataset.id);});});
 el.querySelectorAll('[data-action=comment-cancel]').forEach(function(b){b.addEventListener('click',closeComment);});
 el.querySelectorAll('[data-action=comment-save]').forEach(function(b){b.addEventListener('click',function(){submitComment(b.dataset.id);});});
 el.querySelectorAll('[data-role=c-text]').forEach(function(t){t.addEventListener('input',function(){var id=openCommentId;if(id&&commentDrafts[id])commentDrafts[id].text=t.value;});});
 el.querySelectorAll('[data-role=c-author]').forEach(function(t){t.addEventListener('input',function(){var id=openCommentId;if(id&&commentDrafts[id])commentDrafts[id].author=t.value;});});
}
function render(){document.getElementById('projectHeading').textContent=labelTag(currentProject);renderProjects();renderHistory();}

/* ---------- 外注さん（プロフィールページ形式・案件とは別枠） ---------- */
var staff=[],staffNotes=[],currentStaffId=null,staffHasData=false,staffNotesHasData=false;
var staffEditing=false,staffEditDraft={};
var openStaffNoteId=null,staffNoteDrafts={};
var staffLogEditingId=null,staffLogEditDraft={};
var staffLogDeleteArmedId=null,staffLogDeleteTimer=null;
function staffNotesFor(staffId){var list=staffNotes.filter(function(c){return c.staffId===staffId;});list.sort(function(a,b){return a.createdAt.localeCompare(b.createdAt);});return list;}
function startStaffLogEdit(c){staffLogEditingId=c.id;staffLogEditDraft={text:c.text,author:c.author,msg:''};renderStaff();}
function cancelStaffLogEdit(){staffLogEditingId=null;staffLogEditDraft={};renderStaff();}
function saveStaffLogEdit(id){
 var d=staffLogEditDraft;
 if(!d.text||!d.text.trim()){d.msg='内容を入力してください。';renderStaff();return;}
 rtdb.ref('staffNotes/'+id).update({text:d.text.trim(),author:(d.author||'').trim()||'匿名'}).then(function(){
  staffLogEditingId=null;staffLogEditDraft={};renderStaff();
 }).catch(function(err){
  d.msg='保存できませんでした。('+(err&&err.message||'')+')';renderStaff();
 });
}
function handleStaffLogDelete(id){
 if(staffLogDeleteArmedId!==id){
  staffLogDeleteArmedId=id;clearTimeout(staffLogDeleteTimer);
  staffLogDeleteTimer=setTimeout(function(){staffLogDeleteArmedId=null;renderStaff();},4000);
  renderStaff();return;
 }
 clearTimeout(staffLogDeleteTimer);staffLogDeleteArmedId=null;
 rtdb.ref('staffNotes/'+id).remove().then(function(){renderStaff();});
}
function renderStaffList(){
 var listEl=document.getElementById('staffList');listEl.innerHTML='';
 var selectEl=document.getElementById('staffSelect');selectEl.innerHTML='';
 var sorted=staff.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ja');});
 sorted.forEach(function(p){
  var b=document.createElement('button');b.type='button';b.className='project-button';b.setAttribute('aria-pressed',String(p.id===currentStaffId));
  b.innerHTML='<span class="project-name">'+esc(p.name||'（名前未設定）')+'</span>';
  b.addEventListener('click',function(){currentStaffId=p.id;staffEditing=false;renderStaff();});
  listEl.appendChild(b);
  var opt=document.createElement('option');opt.value=p.id;opt.textContent=p.name||'（名前未設定）';selectEl.appendChild(opt);
 });
 if(currentStaffId)selectEl.value=currentStaffId;
}
document.getElementById('staffSelect').addEventListener('change',function(e){currentStaffId=e.target.value;staffEditing=false;renderStaff();});
document.getElementById('staffAdd').addEventListener('click',function(){
 rtdb.ref('staffProfiles').push({name:'新しい外注さん',profile:'',currentWork:'',updatedAt:new Date().toISOString()}).then(function(ref){
  currentStaffId=ref.key;staffEditing=true;staffEditDraft={name:'新しい外注さん',profile:'',currentWork:'',msg:''};renderStaff();
 });
});
function startStaffEdit(p){staffEditing=true;staffEditDraft={name:p.name,profile:p.profile,currentWork:p.currentWork,msg:''};renderStaff();}
function cancelStaffEdit(){staffEditing=false;staffEditDraft={};renderStaff();}
function saveStaffEdit(id){
 var d=staffEditDraft;
 if(!d.name||!d.name.trim()){d.msg='名前を入力してください。';renderStaff();return;}
 rtdb.ref('staffProfiles/'+id).update({name:d.name.trim(),profile:(d.profile||'').trim(),currentWork:(d.currentWork||'').trim(),updatedAt:new Date().toISOString()}).then(function(){
  staffEditing=false;staffEditDraft={};renderStaff();
 }).catch(function(err){
  d.msg='保存できませんでした。('+(err&&err.message||'')+')';renderStaff();
 });
}
function openStaffNote(staffId){openStaffNoteId=staffId;if(!staffNoteDrafts[staffId])staffNoteDrafts[staffId]={text:'',author:'',msg:''};renderStaff();}
function closeStaffNote(){openStaffNoteId=null;renderStaff();}
function submitStaffNote(staffId){
 var d=staffNoteDrafts[staffId]||{};
 if(!d.text||!d.text.trim()){d.msg='内容を入力してください。';renderStaff();return;}
 rtdb.ref('staffNotes').push({staffId:staffId,text:d.text.trim(),author:(d.author||'').trim()||'匿名',createdAt:new Date().toISOString()}).then(function(){
  delete staffNoteDrafts[staffId];openStaffNoteId=null;renderStaff();
 }).catch(function(err){
  d.msg='送信できませんでした。('+(err&&err.message||'')+')';renderStaff();
 });
}
function renderStaff(){
 renderStaffList();
 var el=document.getElementById('staffDetail');
 if(!staffHasData){el.innerHTML='<div class="note-empty">読み込み中です…</div>';return;}
 if(!staff.length){el.innerHTML='<div class="note-empty"><strong>まだ外注さんが登録されていません</strong><p>左上の「＋」から追加してください。</p></div>';return;}
 if(!currentStaffId||!staff.some(function(p){return p.id===currentStaffId;}))currentStaffId=staff.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ja');})[0].id;
 var p=staff.find(function(x){return x.id===currentStaffId;});
 var nextRow='<div class="staff-next"><label for="staffNextDate">次回依頼日</label><input type="date" id="staffNextDate" value="'+esc(p.nextRequestDate||'')+'" data-id="'+esc(p.id)+'"><button type="button" data-action="s-next-clear" data-id="'+esc(p.id)+'" style="background:transparent;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer">クリア</button><span class="saved-flag" id="staffNextSaved" hidden>保存しました</span></div>';
 var body;
 if(staffEditing){
  var d=staffEditDraft;
  body='<div class="staff-profile"><div class="edit-form">'
   +'<input type="text" data-role="s-name" placeholder="お名前" value="'+esc(d.name||'')+'" style="font-size:18px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px">'
   +'<div class="staff-section-label" style="margin-top:6px">プロフィール（スキル・稼働時間・レートなど）</div>'
   +'<textarea data-role="s-profile" placeholder="プロフィール・スキル・稼働時間・単価など" style="min-height:200px">'+esc(d.profile||'')+'</textarea>'
   +'<div class="staff-section-label">依頼している内容</div>'
   +'<textarea data-role="s-currentwork" placeholder="今お願いしている業務・稼働状況など" style="min-height:100px">'+esc(d.currentWork||'')+'</textarea>'
   +(d.msg?'<div class="form-msg">'+esc(d.msg)+'</div>':'')
   +'<div class="edit-form-foot"><button type="button" data-action="s-cancel">キャンセル</button><button type="button" class="primary" data-action="s-save" data-id="'+esc(p.id)+'">保存</button></div>'
   +'</div></div>';
 }else{
  var updated=p.updatedAt?noteCreatedDay(p.updatedAt):'';
  body='<div class="staff-profile"><div class="staff-name">'+esc(p.name||'（名前未設定）')+'</div>'
   +'<div class="staff-section"><div class="staff-section-label">プロフィール</div><p class="project-note-text">'+esc(p.profile||'（未入力）')+'</p></div>'
   +'<div class="staff-section"><div class="staff-section-label">依頼している内容</div><p class="project-note-text">'+esc(p.currentWork||'（未入力）')+'</p></div>'
   +(updated?'<p class="staff-updated">最終更新：'+esc(updated)+'</p>':'')
   +'<div class="note-actions"><button type="button" data-action="s-open" data-id="'+esc(p.id)+'">編集</button></div>'
   +'</div>';
 }
 body+='<div class="staff-log-heading">ログ</div>'+renderCommentThread(p.id,'staffNotes');
 el.innerHTML=nextRow+body;
 bindStaffEvents();
}
function bindStaffEvents(){
 var el=document.getElementById('staffDetail');
 el.querySelectorAll('[data-action=s-open]').forEach(function(b){b.addEventListener('click',function(){var p=staff.find(function(x){return x.id===b.dataset.id;});if(p)startStaffEdit(p);});});
 el.querySelectorAll('[data-action=s-cancel]').forEach(function(b){b.addEventListener('click',cancelStaffEdit);});
 el.querySelectorAll('[data-action=s-save]').forEach(function(b){b.addEventListener('click',function(){saveStaffEdit(b.dataset.id);});});
 el.querySelectorAll('[data-role=s-name]').forEach(function(t){t.addEventListener('input',function(){staffEditDraft.name=t.value;});});
 el.querySelectorAll('[data-role=s-profile]').forEach(function(t){t.addEventListener('input',function(){staffEditDraft.profile=t.value;});});
 el.querySelectorAll('[data-role=s-currentwork]').forEach(function(t){t.addEventListener('input',function(){staffEditDraft.currentWork=t.value;});});
 el.querySelectorAll('[data-action=staffnote-open]').forEach(function(b){b.addEventListener('click',function(){openStaffNote(b.dataset.id);});});
 el.querySelectorAll('[data-action=staffnote-cancel]').forEach(function(b){b.addEventListener('click',closeStaffNote);});
 el.querySelectorAll('[data-action=staffnote-save]').forEach(function(b){b.addEventListener('click',function(){submitStaffNote(b.dataset.id);});});
 el.querySelectorAll('[data-role=staffnote-text]').forEach(function(t){t.addEventListener('input',function(){var id=openStaffNoteId;if(id&&staffNoteDrafts[id])staffNoteDrafts[id].text=t.value;});});
 el.querySelectorAll('[data-role=staffnote-author]').forEach(function(t){t.addEventListener('input',function(){var id=openStaffNoteId;if(id&&staffNoteDrafts[id])staffNoteDrafts[id].author=t.value;});});
 var nextInput=document.getElementById('staffNextDate');
 if(nextInput)nextInput.addEventListener('change',function(){saveStaffNextDate(nextInput.dataset.id,nextInput.value);});
 el.querySelectorAll('[data-action=s-next-clear]').forEach(function(b){b.addEventListener('click',function(){saveStaffNextDate(b.dataset.id,'');});});
 el.querySelectorAll('[data-action=log-edit-open]').forEach(function(b){b.addEventListener('click',function(){var c=staffNotes.find(function(x){return x.id===b.dataset.id;});if(c)startStaffLogEdit(c);});});
 el.querySelectorAll('[data-action=log-e-cancel]').forEach(function(b){b.addEventListener('click',cancelStaffLogEdit);});
 el.querySelectorAll('[data-action=log-e-save]').forEach(function(b){b.addEventListener('click',function(){saveStaffLogEdit(b.dataset.id);});});
 el.querySelectorAll('[data-role=log-e-text]').forEach(function(t){t.addEventListener('input',function(){staffLogEditDraft.text=t.value;});});
 el.querySelectorAll('[data-role=log-e-author]').forEach(function(t){t.addEventListener('input',function(){staffLogEditDraft.author=t.value;});});
 el.querySelectorAll('[data-action=log-delete]').forEach(function(b){b.addEventListener('click',function(){handleStaffLogDelete(b.dataset.id);});});
}
function saveStaffNextDate(id,value){
 rtdb.ref('staffProfiles/'+id).update({nextRequestDate:value||null}).then(function(){
  var flag=document.getElementById('staffNextSaved');
  if(flag){flag.hidden=false;setTimeout(function(){flag.hidden=true;},2000);}
 });
}

/* ---------- connect ---------- */
function connectData(){
 rtdb.ref('siteMemos').on('value',function(snap){
  var val=snap.val()||{};
  notes=Object.keys(val).map(function(id){
   var raw=val[id]||{};
   return {id:id,projectTag:canonicalProject(raw.projectTag),text:typeof raw.text==='string'?raw.text:'',date:isoDay(raw.date)||noteCreatedDay(raw.createdAt),author:String(raw.author||'未設定'),createdAt:typeof raw.createdAt==='string'?raw.createdAt:''};
  });
  hasData=true;
  document.getElementById('status').hidden=true;
  if(currentView==='notes')document.getElementById('notesView').hidden=false;
  render();
 },function(err){
  var s=document.getElementById('status');s.hidden=false;s.className='status error';s.textContent='読み込めませんでした。時間をおいて再度開いてください。('+(err&&err.message||'')+')';
 });
 rtdb.ref('siteMemoComments').on('value',function(snap){
  var val=snap.val()||{};
  comments=Object.keys(val).map(function(id){
   var raw=val[id]||{};
   return {id:id,memoId:String(raw.memoId||''),text:typeof raw.text==='string'?raw.text:'',author:String(raw.author||'匿名'),createdAt:typeof raw.createdAt==='string'?raw.createdAt:''};
  });
  commentsHasData=true;
  if(hasData&&currentView==='notes')renderHistory();
 },function(err){console.error('siteMemoComments load failed',err);});
 rtdb.ref('staffProfiles').on('value',function(snap){
  var val=snap.val()||{};
  staff=Object.keys(val).map(function(id){
   var raw=val[id]||{};
   return {id:id,name:String(raw.name||''),profile:typeof raw.profile==='string'?raw.profile:'',currentWork:typeof raw.currentWork==='string'?raw.currentWork:'',nextRequestDate:isoDay(raw.nextRequestDate),updatedAt:typeof raw.updatedAt==='string'?raw.updatedAt:''};
  });
  staffHasData=true;
  if(currentView==='staff'){document.getElementById('staffView').hidden=false;renderStaff();}
 },function(err){console.error('staffProfiles load failed',err);});
 rtdb.ref('staffNotes').on('value',function(snap){
  var val=snap.val()||{};
  staffNotes=Object.keys(val).map(function(id){
   var raw=val[id]||{};
   return {id:id,staffId:String(raw.staffId||''),text:typeof raw.text==='string'?raw.text:'',author:String(raw.author||'匿名'),createdAt:typeof raw.createdAt==='string'?raw.createdAt:''};
  });
  staffNotesHasData=true;
  if(staffHasData&&currentView==='staff')renderStaff();
 },function(err){console.error('staffNotes load failed',err);});
}
firebase.auth().signInAnonymously().then(function(){
 authReady=true;
 connectData();
}).catch(function(err){
 var s=document.getElementById('status');s.hidden=false;s.className='status error';s.textContent='接続できませんでした。時間をおいて再度開いてください。('+(err&&err.message||'')+')';
});
</script>
</body>
</html>
